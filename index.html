<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ever After — Wedding Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128141;</text></svg>">
<style>
  :root {
    --font-display: "Cormorant Garamond", "Playfair Display", "Hoefler Text", Didot, Garamond, Cochin, Georgia, serif;
    --font-body: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;

    --page: #f3ede3;
    --surface: #faf7f2;
    --surface-raised: #fffdf9;
    --ink: #2b2624;
    --ink-2: #6b6259;
    --ink-3: #93887c;
    --hairline: #e6ddd0;
    --hairline-strong: #d8ccbb;
    --accent: #a4523f;         /* validated: 3:1+ on --surface, chroma & lightness in band */
    --accent-ink: #8a4434;
    --accent-track: #ecd9d0;
    --accent-wash: rgba(164, 82, 63, 0.07);
    --gold: #a3803c;
    --good: #0ca30c;
    --good-text: #1e7a1e;
    --warn: #fab219;
    --warn-text: #8a6403;
    --critical: #d03b3b;
    --shadow: 0 1px 2px rgba(43,38,36,.05), 0 6px 24px -12px rgba(43,38,36,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #141210;
      --surface: #201c19;
      --surface-raised: #282320;
      --ink: #f4ede4;
      --ink-2: #c9bfb2;
      --ink-3: #8f8578;
      --hairline: #37312b;
      --hairline-strong: #4a4239;
      --accent: #c97f5f;       /* validated for the dark surface */
      --accent-ink: #d99a7e;
      --accent-track: #453229;
      --accent-wash: rgba(201, 127, 95, 0.10);
      --gold: #c9a86a;
      --good-text: #58c058;
      --warn-text: #e6b84a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -12px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }

  h1, h2, h3, .display { font-family: var(--font-display); font-weight: 500; letter-spacing: .01em; }
  h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.08; }
  h2 { font-size: 28px; line-height: 1.15; }
  h3 { font-size: 21px; }
  .eyebrow {
    font-family: var(--font-sans); font-size: 11px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3);
  }
  .lede { color: var(--ink-2); font-size: 17px; font-style: italic; }
  .num { font-family: var(--font-sans); }
  .tabular { font-variant-numeric: tabular-nums; }

  /* ---------- shared components ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 14px; padding: 22px; box-shadow: var(--shadow);
  }
  .btn {
    font-family: var(--font-sans); font-size: 14px; font-weight: 600;
    border: 1px solid var(--hairline-strong); border-radius: 999px;
    background: var(--surface-raised); color: var(--ink);
    padding: 9px 18px; cursor: pointer; transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
  .btn-small { padding: 5px 12px; font-size: 12.5px; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--accent-wash); }

  input[type="text"], input[type="date"], input[type="number"], select, textarea {
    font-family: var(--font-body); font-size: 15px; color: var(--ink);
    background: var(--surface-raised); border: 1px solid var(--hairline-strong);
    border-radius: 9px; padding: 9px 12px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  label.field-label {
    display: block; font-family: var(--font-sans); font-size: 12px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }

  input[type="checkbox"] {
    appearance: none; width: 19px; height: 19px; flex: 0 0 19px;
    border: 1.5px solid var(--hairline-strong); border-radius: 50%;
    background: var(--surface-raised); cursor: pointer; position: relative; top: 2px;
    transition: all .15s ease;
  }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 5.5px; top: 2.5px; width: 4px; height: 8px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }

  .chip {
    display: inline-block; font-family: var(--font-sans); font-size: 12px; font-weight: 600;
    letter-spacing: .04em; padding: 4px 12px; border-radius: 999px;
    background: var(--accent-wash); color: var(--accent-ink); border: 1px solid transparent;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-sans); font-size: 11.5px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
  }
  .tag-good { color: var(--good-text); background: rgba(12,163,12,.09); }
  .tag-warn { color: var(--warn-text); background: rgba(250,178,25,.13); }
  .tag-critical { color: var(--critical); background: rgba(208,59,59,.10); }
  .tag-muted { color: var(--ink-3); background: var(--accent-wash); }

  .divider { border: 0; border-top: 1px solid var(--hairline); margin: 20px 0; }
  .flourish { text-align: center; color: var(--gold); font-size: 18px; letter-spacing: .5em; margin: 8px 0 4px; user-select: none; }

  /* ---------- nav ---------- */
  nav.tabs {
    display: flex; gap: 4px; flex-wrap: wrap; margin: 26px 0 30px;
    border-bottom: 1px solid var(--hairline); padding-bottom: 0;
  }
  nav.tabs button {
    font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 10px 14px; cursor: pointer; border-radius: 8px 8px 0 0;
  }
  nav.tabs button:hover { color: var(--accent-ink); background: var(--accent-wash); }
  nav.tabs button.active { color: var(--accent-ink); border-bottom-color: var(--accent); }

  /* ---------- onboarding ---------- */
  .onboard { max-width: 560px; margin: 0 auto; }
  .onboard-head { text-align: center; margin: 40px 0 34px; }
  .keyword-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 540px) { .keyword-row { grid-template-columns: 1fr; } }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 540px) { .two-col { grid-template-columns: 1fr; } }

  /* ---------- overview ---------- */
  .hero { text-align: center; padding: 34px 20px 26px; }
  .hero .names { font-size: clamp(36px, 7vw, 58px); }
  .amp { color: var(--gold); font-style: italic; padding: 0 .12em; }
  .countdown { font-size: clamp(44px, 8vw, 68px); line-height: 1; color: var(--accent-ink); }
  .kw-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
  @media (max-width: 700px) { .overview-grid { grid-template-columns: 1fr; } }
  .snap-list { list-style: none; }
  .snap-list li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--hairline); align-items: baseline; }
  .snap-list li:last-child { border-bottom: none; }

  /* meter (progress) */
  .meter { height: 8px; border-radius: 4px; background: var(--accent-track); overflow: hidden; }
  .meter > span { display: block; height: 100%; border-radius: 4px; background: var(--accent); min-width: 2px; transition: width .3s ease; }

  /* ---------- timeline ---------- */
  .month-block { position: relative; padding-left: 30px; margin-bottom: 8px; }
  .month-block::before {
    content: ""; position: absolute; left: 8px; top: 34px; bottom: -6px;
    width: 1px; background: var(--hairline-strong);
  }
  .month-block:last-child::before { display: none; }
  .month-dot {
    position: absolute; left: 2px; top: 14px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--page); border: 2px solid var(--accent);
  }
  .month-block.month-done .month-dot { background: var(--accent); }
  .month-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 8px 0 2px; cursor: pointer; }
  .month-when { font-family: var(--font-sans); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
  .month-blurb { color: var(--ink-2); font-style: italic; font-size: 14.5px; margin: 2px 0 10px; }
  .task { display: flex; gap: 11px; padding: 7px 0; align-items: flex-start; }
  .task .wk {
    font-family: var(--font-sans); font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink-3); text-transform: uppercase; flex: 0 0 52px; padding-top: 4px;
  }
  .task label.tx { cursor: pointer; flex: 1; }
  .task.done label.tx { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--hairline-strong); }
  .month-tasks { padding-bottom: 14px; }

  /* ---------- vendors ---------- */
  .vendor-card { margin-bottom: 16px; }
  .vendor-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; cursor: pointer; }
  .vendor-head h3 { flex: 1; min-width: 160px; }
  .vendor-status select { width: auto; font-family: var(--font-sans); font-size: 13px; padding: 6px 10px; }
  .q-list { list-style: none; margin-top: 14px; }
  .q-list li { display: flex; gap: 11px; padding: 7px 0; border-top: 1px dashed var(--hairline); align-items: flex-start; }
  .q-list li label { cursor: pointer; flex: 1; }
  .q-list li.done label { color: var(--ink-3); }
  .vendor-notes { margin-top: 12px; }
  .vendor-notes textarea { min-height: 60px; resize: vertical; font-size: 14px; }

  /* ---------- budget (viz) ---------- */
  .viz-root { position: relative; }
  .budget-row { padding: 10px 0; border-bottom: 1px dashed var(--hairline); }
  .budget-row:last-child { border-bottom: none; }
  .budget-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .budget-cat { font-size: 15.5px; }
  .budget-figs { font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .budget-figs b { color: var(--ink); font-weight: 600; }
  .budget-bar-lane { display: flex; align-items: center; gap: 14px; }
  .budget-lane-track { flex: 1; }
  .budget-bar { height: 14px; border-radius: 0 4px 4px 0; background: var(--accent-track); position: relative; overflow: hidden; box-shadow: inset 1px 0 0 var(--hairline-strong); }
  .budget-bar > .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
  .budget-spent-input { width: 110px !important; font-family: var(--font-sans); font-size: 13px; padding: 5px 9px; text-align: right; }
  .viz-tip {
    position: absolute; z-index: 10; pointer-events: none; display: none;
    background: var(--surface-raised); border: 1px solid var(--hairline-strong); border-radius: 9px;
    padding: 8px 12px; font-family: var(--font-sans); font-size: 12.5px; box-shadow: var(--shadow);
    max-width: 240px;
  }
  .budget-summary { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat-tile { flex: 1 1 130px; }
  .stat-tile .v { font-family: var(--font-sans); font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  .stat-tile .l { font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 1px; }

  /* ---------- payments ---------- */
  .pay-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px dashed var(--hairline); }
  .pay-row:last-child { border-bottom: none; }
  .pay-main { flex: 1; }
  .pay-when { font-family: var(--font-sans); font-size: 12px; color: var(--ink-3); }
  .pay-amt { font-family: var(--font-sans); font-size: 15px; font-weight: 600; white-space: nowrap; padding-top: 2px; }
  .pay-row.paid .pay-main, .pay-row.paid .pay-amt { color: var(--ink-3); }
  .pay-row.paid .pay-title { text-decoration: line-through; text-decoration-color: var(--hairline-strong); }
  .add-inline { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 14px; }
  @media (max-width: 640px) { .add-inline { grid-template-columns: 1fr 1fr; } }

  /* ---------- rsvp ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 640px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
  .guest-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--hairline); flex-wrap: wrap; }
  .guest-name { flex: 1 1 150px; }
  .guest-meta { font-family: var(--font-sans); font-size: 12px; color: var(--ink-3); }
  .guest-row select { width: auto; font-family: var(--font-sans); font-size: 12.5px; padding: 5px 8px; }
  .add-guest { display: grid; grid-template-columns: 2fr 70px 1.2fr 1.2fr auto; gap: 10px; align-items: end; margin-top: 16px; }
  @media (max-width: 700px) { .add-guest { grid-template-columns: 1fr 1fr; } }

  /* ---------- seating ---------- */
  .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
  .table-card { background: var(--surface-raised); border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; }
  .table-card h4 { font-family: var(--font-display); font-size: 19px; font-weight: 500; }
  .table-cap { font-family: var(--font-sans); font-size: 11.5px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
  .seat-list { list-style: none; margin-top: 10px; }
  .seat-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: 14.5px; border-top: 1px dashed var(--hairline); }
  .seat-group { font-family: var(--font-sans); font-size: 10.5px; color: var(--ink-3); }
  .unassigned-chip {
    display: inline-flex; align-items: center; gap: 7px; margin: 4px 6px 4px 0;
    border: 1px solid var(--hairline-strong); border-radius: 999px; padding: 5px 8px 5px 14px;
    background: var(--surface-raised); font-size: 14px;
  }
  .unassigned-chip select { width: auto; font-family: var(--font-sans); font-size: 12px; padding: 3px 6px; border-radius: 6px; }
  .conflict-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .conflict-row select { width: auto; flex: 1 1 140px; font-family: var(--font-sans); font-size: 13px; }
  .x-btn { background: none; border: none; color: var(--ink-3); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .x-btn:hover { color: var(--critical); background: rgba(208,59,59,.08); }

  .section-intro { margin-bottom: 22px; }
  .section-intro h2 { margin-bottom: 6px; }
  .empty-note { color: var(--ink-3); font-style: italic; padding: 14px 0; }
  footer.app-foot { margin-top: 56px; text-align: center; color: var(--ink-3); font-size: 13px; }
  footer.app-foot .foot-actions { margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media print {
    nav.tabs, .btn, .foot-actions, input.budget-spent-input { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="viz-tip" id="vizTip"></div>

<script>
"use strict";

/* ============================================================
   Ever After — a wedding planning command center.
   All data lives in localStorage; nothing leaves this browser.
   ============================================================ */

const STORE_KEY = "everAfter.v1";

const $app = document.getElementById("app");
const $tip = document.getElementById("vizTip");

/* ---------- state ---------- */
function blankState() {
  return {
    setup: null, // {names, date, venueType, budget, guestCount, keywords:[..3]}
    view: "overview",
    tasksDone: {},        // taskId -> true
    vendorChecks: {},     // "vendorId.qIdx" -> true
    vendors: {},          // vendorId -> {status, notes}
    budgetSpent: {},      // categoryId -> number
    paymentsPaid: {},     // paymentId -> true
    customPayments: [],   // {id, title, due, amount}
    guests: [],           // {id, name, party, group, status}
    conflicts: [],        // [idA, idB]
    tables: [],           // {id, name, capacity, seats:[guestIds]}
    openMonths: {},       // monthsOut -> bool (timeline accordion)
    openVendors: {}       // vendorId -> bool
  };
}
let state = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(blankState(), JSON.parse(raw));
  } catch (e) { /* corrupted store — start fresh */ }
  return blankState();
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function uid() { return Math.random().toString(36).slice(2, 9); }

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function money(n) {
  return "$" + Math.round(n).toLocaleString("en-US");
}
function weddingDate() { return new Date(state.setup.date + "T12:00:00"); }
function daysUntil() { return Math.ceil((weddingDate() - new Date()) / 86400000); }
function monthsBefore(n) {
  const d = weddingDate(); d.setMonth(d.getMonth() - n); return d;
}
function monthLabel(d) { return d.toLocaleDateString("en-US", { month: "long", year: "numeric" }); }
function niceDate(d) { return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); }
function firstNames() {
  return state.setup.names.split(/\s*(?:&|\band\b|\+)\s*/i).map(s => s.trim()).filter(Boolean);
}
function kw(i) { return state.setup.keywords[i] || ""; }

const VENUE_TYPES = {
  garden:      { label: "Garden / estate",    place: "garden" },
  ballroom:    { label: "Ballroom / hotel",   place: "ballroom" },
  barn:        { label: "Barn / rustic",      place: "barn" },
  beach:       { label: "Beach / coastal",    place: "beach" },
  vineyard:    { label: "Vineyard / winery",  place: "vineyard" },
  loft:        { label: "City loft / industrial", place: "loft" },
  backyard:    { label: "Backyard / at home", place: "backyard" },
  destination: { label: "Destination",        place: "destination venue" }
};

/* ============================================================
   TIMELINE — 12 months of weekly tasks, personalized
   ============================================================ */
const VENUE_TASKS = {
  garden: {
    7: "Nail down the weather plan — get a tent on hold and price the side walls now, not in a panic later.",
    6: "Walk the garden at dusk and plan evening light: strings, lanterns, path markers.",
    3: "Order guest comforts — wraps or fans for the ceremony, a basket of bug spray, an umbrella stash."
  },
  ballroom: {
    10: "Confirm the ballroom's food & beverage minimums and what the in-house catering actually includes.",
    6: "Book the uplighting/décor walkthrough — ballrooms transform completely with the right light.",
    3: "Sort valet and parking validation so guests glide in without thinking about it."
  },
  barn: {
    8: "Reserve the big rentals — tables, chairs, linens, and dishware rarely come with a barn.",
    6: "Plan lighting and power: string lights, a generator quote, and where the band plugs in.",
    4: "Think guest comfort: fans or heaters depending on season, and clear signage from parking.",
    2: "Schedule the pest treatment / bug plan with the venue for the week before."
  },
  beach: {
    10: "Check permits for the ceremony spot — beach use, amplified sound, and chairs often need one.",
    6: "Choose wind-proof décor (weighted, low, secured) and confirm a sound system that beats the surf.",
    5: "Time the ceremony to the tide chart and golden hour — your photographer will thank you.",
    3: "Plan the footwear story: a shoe valet basket, or tell guests early it's a barefoot affair."
  },
  vineyard: {
    11: "Ask the vineyard about harvest-season blackout dates before you fall in love with a weekend.",
    7: "Book the wine pairing tasting — pouring the estate's own wine is half the magic.",
    5: "Arrange shuttles — vineyards are gorgeous and remote, and your guests will be tasting."
  },
  loft: {
    8: "Get the building's load-in rules in writing: freight elevator hours, insurance certificates.",
    6: "Book a lighting designer — raw space plus great light is the whole look.",
    5: "Confirm sound restrictions and neighbor rules for the end of the night."
  },
  backyard: {
    9: "Order the infrastructure: tent, restrooms, and a rental walk-through of the yard.",
    8: "Talk to the neighbors and check local permits for noise and parking.",
    6: "Get a power plan — a generator quote beats a blown fuse during the first dance.",
    2: "Book a professional cleanup crew for the day after. Future you insists."
  },
  destination: {
    11: "Lock room blocks and travel details early — your guests are booking flights, not just a Saturday.",
    10: "Research the marriage-license and residency rules for the location (some need days on the ground).",
    3: "Plan a welcome gathering and figure out what décor ships vs. what gets bought there.",
    2: "Assemble welcome bags: itinerary, local treats, and a heartfelt note from you both."
  }
};

function timelinePlan() {
  const s = state.setup;
  const venue = VENUE_TYPES[s.venueType] || VENUE_TYPES.garden;
  const [k1, k2, k3] = s.keywords;
  const base = {
    12: { title: "Dream it up", blurb: `This month is pure imagination — everything ${esc(k1)} and ${esc(k2)} is allowed.`, weeks: [

      cal: m === 0 ? niceDate(weddingDate()) : monthLabel(monthsBefore(m)),

];
// Per-venue nudges; each set of deltas sums to zero.
const BUDGET_MODS = {
  garden:      { flowers: +2, buffer: +1, venue: -1, catering: -2 },
  ballroom:    { venue: +4, catering: +1, flowers: -2, transport: -1, buffer: -1, music: -1 },
  barn:        { flowers: +2, catering: +1, transport: +1, buffer: +1, venue: -2, music: -1, stationery: -1, favors: -1 },
  beach:       { transport: +2, music: +1, buffer: +1, venue: -2, flowers: -1, catering: -1 },
  vineyard:    { catering: +2, venue: +1, transport: +1, flowers: -1, music: -1, buffer: -1, favors: -1 },
  loft:        { flowers: +2, music: +1, venue: -1, catering: -1, transport: -1 },
  backyard:    { catering: +3, flowers: +2, buffer: +2, photo: +1, music: +1, venue: -8, transport: -1 },
  destination: { transport: +4, favors: +1, stationery: +1, video: +1, venue: -2, flowers: -2, music: -1, cake: -1, buffer: -1 }
};
function budgetPlan() {
  const mods = BUDGET_MODS[state.setup.venueType] || {};
  const total = Number(state.setup.budget) || 0;
  return BUDGET_BASE.map(c => {
    const pct = Math.max(0, c.pct + (mods[c.id] || 0));
    return { ...c, pct, amount: total * pct / 100 };
  }).filter(c => c.pct > 0);
}

  const alloc = Object.fromEntries(budgetPlan().map(c => [c.id, c.amount]));

  const daysB = n => { const d = new Date(w); d.setDate(d.getDate() - n); return d; };
  const P = (id, title, date, amount) => ({ id, title, due: date, amount, generated: true });
  return [
    P("venueDep",  "Venue deposit (typically 50%)",            monthsBefore(11), (alloc.venue || 0) * 0.5),
    P("photoDep",  "Photographer retainer (~30%)",             monthsBefore(10), (alloc.photo || 0) * 0.3),
    P("caterDep",  "Caterer deposit (~25%)",                   monthsBefore(9),  (alloc.catering || 0) * 0.25),
    P("musicDep",  "Band / DJ deposit (~50%)",                 monthsBefore(8),  (alloc.music || 0) * 0.5),
    P("florDep",   "Florist deposit (~25%)",                   monthsBefore(6),  (alloc.flowers || 0) * 0.25),
    P("attireBal", "Attire balance at final fitting",          monthsBefore(3),  (alloc.attire || 0) * 0.5),
    P("venueBal",  "Venue balance",                            monthsBefore(1),  (alloc.venue || 0) * 0.5),
    P("florBal",   "Florist balance",                          daysB(14),        (alloc.flowers || 0) * 0.75),
    P("caterBal",  "Caterer balance (with final headcount)",   daysB(14),        (alloc.catering || 0) * 0.75),

    P("musicBal",  "Band / DJ balance",                        daysB(7),         (alloc.music || 0) * 0.5),

function allPayments() {
  const custom = state.customPayments.map(p => ({ ...p, due: new Date(p.due + "T12:00:00"), generated: false }));
  return [...generatedPayments(), ...custom].sort((a, b) => a.due - b.due);
}

/* ============================================================
   SEATING — group-aware auto arrangement
   ============================================================ */
function seatableGuests() {
  return state.guests.filter(g => g.status !== "declined");
}
function guestById(id) { return state.guests.find(g => g.id === id); }
function hasConflict(guestId, tableSeats) {
  return state.conflicts.some(([a, b]) =>
    (a === guestId && tableSeats.includes(b)) || (b === guestId && tableSeats.includes(a)));
}
function tableFree(t) {
  const used = t.seats.reduce((n, id) => n + (guestById(id)?.party || 0), 0);
  return t.capacity - used;
}
function autoArrange() {
  state.tables.forEach(t => t.seats = []);
  if (!state.tables.length) defaultTables();
  // Group guests by relationship group, biggest groups first, biggest parties first.
  const groups = {};
  for (const g of seatableGuests()) {
    const key = (g.group || "Friends").trim().toLowerCase();
    (groups[key] = groups[key] || []).push(g);
  }
  const ordered = Object.values(groups)
    .sort((a, b) => b.reduce((n, g) => n + g.party, 0) - a.reduce((n, g) => n + g.party, 0));
  for (const grp of ordered) {
    grp.sort((a, b) => b.party - a.party);
    for (const g of grp) {
      // Prefer the table already holding the most of this guest's group,
      // then the fullest table that still fits (packs groups tightly together).
      let best = null, bestScore = -1;
      for (const t of state.tables) {
        if (tableFree(t) < g.party) continue;
        if (hasConflict(g.id, t.seats)) continue;
        const groupmates = t.seats.filter(id => {
          const o = guestById(id);
          return o && (o.group || "Friends").trim().toLowerCase() === (g.group || "Friends").trim().toLowerCase();
        }).length;
        const score = groupmates * 1000 + (t.capacity - tableFree(t));
        if (score > bestScore) { bestScore = score; best = t; }
      }
      if (best) best.seats.push(g.id);
    }
  }
  save();
}
function defaultTables() {
  const seatsNeeded = seatableGuests().reduce((n, g) => n + g.party, 0) ||
    Number(state.setup.guestCount) || 0;
  const count = Math.max(1, Math.ceil(seatsNeeded / 8));
  state.tables = Array.from({ length: count }, (_, i) =>
    ({ id: uid(), name: `Table ${i + 1}`, capacity: 8, seats: [] }));
}

        <li><span style="color:var(--gold)">✦</span><span>${nextPay ?
          `Next payment: <b>${esc(nextPay.title)}</b> — <span class="num tabular">${money(nextPay.amount)}</span> due ${niceDate(nextPay.due)}` :
          "No upcoming payments on the tracker."}</span></li>
        <li><span style="color:var(--gold)">✦</span><span><span class="num tabular">${attending}</span> guests attending so far${awaiting ? `, <span class="num tabular">${awaiting}</span> ${awaiting === 1 ? "invitation" : "invitations"} awaiting a reply` : ""} — planning for about <span class="num tabular">${esc(state.setup.guestCount)}</span>.</span></li>
        <li><span style="color:var(--gold)">✦</span><span>Budget of <span class="num tabular">${money(state.setup.budget)}</span>, thoughtfully divided on the Budget tab.</span></li>
      </ul>

}

/* ---------- timeline ---------- */
function renderTimeline() {
  const plan = timelinePlan();
  const today = new Date();
  return `
  <div class="section-intro">
    <h2>Your twelve months, one gentle week at a time</h2>
    <p class="lede">Built around ${niceDate(weddingDate())} at a ${VENUE_TYPES[state.setup.venueType].label.toLowerCase()} —
    with room left for the ${esc(kw(0))}, ${esc(kw(1))}, ${esc(kw(2))} day you're making.</p>
  </div>
  ${plan.map(mo => {
    const done = mo.weeks.filter(w => state.tasksDone[w.id]).length;
    const allDone = done === mo.weeks.length;
    const isPast = mo.m > 0 && monthsBefore(mo.m - 1) < today;
    const isCurrent = !isPast && monthsBefore(mo.m) <= today;
    const open = state.openMonths[mo.m] !== undefined ? state.openMonths[mo.m] : isCurrent;
    return `
    <div class="month-block ${allDone ? "month-done" : ""}">
      <div class="month-dot"></div>
      <div class="month-head" data-action="toggle-month" data-m="${mo.m}">
        <span class="month-when">${mo.when}</span>
        <h3>${mo.title}</h3>
        <span class="num tabular" style="font-family:var(--font-sans);font-size:12px;color:var(--ink-3)">
          ${mo.cal} · ${done}/${mo.weeks.length}</span>
        ${isPast && !allDone ? `<span class="tag tag-warn">⚠ catch up</span>` : ""}
        ${isCurrent ? `<span class="tag tag-good">✦ this month</span>` : ""}
      </div>
      ${open ? `
      <p class="month-blurb">${mo.blurb}</p>
      <div class="month-tasks">
        ${mo.weeks.map(w => `
          <div class="task ${state.tasksDone[w.id] ? "done" : ""}">
            <span class="wk">${w.wk}</span>
            <input type="checkbox" id="t-${w.id}" data-action="task" data-id="${w.id}" ${state.tasksDone[w.id] ? "checked" : ""}>
            <label class="tx" for="t-${w.id}">${w.text}</label>
          </div>`).join("")}
      </div>` : ""}
    </div>`;
  }).join("")}`;
}

/* ---------- budget ---------- */
function renderBudget() {
  const plan = budgetPlan();
  const total = Number(state.setup.budget) || 0;
  const spentTotal = plan.reduce((n, c) => n + (Number(state.budgetSpent[c.id]) || 0), 0);
  const maxAmt = Math.max(...plan.map(c => c.amount), 1);
  return `
  <div class="section-intro">
    <h2>Where the ${money(total)} goes</h2>
    <p class="lede">A starting allocation shaped for a ${VENUE_TYPES[state.setup.venueType].label.toLowerCase()} wedding.
    Log what you've actually spent or committed, and watch each envelope fill.</p>
  </div>
  <div class="card viz-root" data-viz="budget">
    <div class="budget-summary">
      <div class="stat-tile"><div class="v tabular">${money(total)}</div><div class="l">Total budget</div></div>
      <div class="stat-tile"><div class="v tabular" style="color:var(--accent-ink)">${money(spentTotal)}</div><div class="l">Spent / committed</div></div>
      <div class="stat-tile"><div class="v tabular" style="color:${total - spentTotal < 0 ? "var(--critical)" : "inherit"}">${money(total - spentTotal)}</div><div class="l">Still yours</div></div>
    </div>
    <hr class="divider">
    ${plan.map(c => {
      const spent = Number(state.budgetSpent[c.id]) || 0;
      const laneW = (c.amount / maxAmt * 100).toFixed(1);
      const fillW = c.amount > 0 ? Math.min(100, spent / c.amount * 100).toFixed(1) : 0;
      const over = spent > c.amount;
      return `
      <div class="budget-row" data-tip="${esc(c.name)} — allocated ${money(c.amount)} (${c.pct}%), spent ${money(spent)}, ${over ? money(spent - c.amount) + " over" : money(c.amount - spent) + " left"}">
        <div class="budget-row-top">
          <span class="budget-cat">${c.name} <span style="font-family:var(--font-sans);font-size:11.5px;color:var(--ink-3)">${c.pct}%</span></span>
          <span class="budget-figs tabular"><b>${money(c.amount)}</b> planned${spent ? ` · ${money(spent)} spent` : ""}
            ${over ? ` <span class="tag tag-critical">⚠ over</span>` : ""}</span>
        </div>
        <div class="budget-bar-lane">
          <div class="budget-lane-track">
            <div class="budget-bar" style="width:${laneW}%;min-width:40px">
              <span class="fill" style="width:${fillW}%"></span>
            </div>
          </div>
          <input type="number" class="budget-spent-input tabular" min="0" step="50" placeholder="spent $"
            value="${spent || ""}" data-action="budget-spent" data-id="${c.id}" aria-label="Amount spent on ${esc(c.name)}">
        </div>
      </div>`;
    }).join("")}
    <p style="margin-top:14px;font-family:var(--font-sans);font-size:12px;color:var(--ink-3)">
      Bar length shows each category's share of the plan; the deeper fill is what you've spent of it.</p>
  </div>`;
}

      <span style="color:var(--ink-3)">shouldn't sit with</span>

      <span class="unassigned-chip">${esc(x.name)}<span class="guest-meta">(${x.party})</span>

          <option value="">table…</option>

/* ============================================================
   EVENTS — one delegated listener each for click / change / submit
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "nav") { state.view = el.dataset.view; save(); render(); }
  else if (a === "edit-setup") { $app.innerHTML = renderOnboarding(state.setup); }
  else if (a === "cancel-edit") { render(); }
  else if (a === "toggle-month") {
    if (e.target.closest("input,label")) return;
    const m = el.dataset.m;
    const plan = timelinePlan(); const mo = plan.find(x => String(x.m) === m);
    const isCurrent = mo && monthsBefore(mo.m) <= new Date() && !(mo.m > 0 && monthsBefore(mo.m - 1) < new Date());
    const cur = state.openMonths[m] !== undefined ? state.openMonths[m] : isCurrent;
    state.openMonths[m] = !cur; save(); render();
  }
  else if (a === "toggle-vendor") {
    if (e.target.closest("select,input,textarea")) return;
    state.openVendors[el.dataset.id] = !state.openVendors[el.dataset.id]; save(); render();
  }
  else if (a === "pay-remove") {
    state.customPayments = state.customPayments.filter(p => p.id !== el.dataset.id);
    delete state.paymentsPaid[el.dataset.id]; save(); render();
  }
  else if (a === "guest-remove") {
    const id = el.dataset.id;
    state.guests = state.guests.filter(g => g.id !== id);
    state.conflicts = state.conflicts.filter(([x, y]) => x !== id && y !== id);
    state.tables.forEach(t => t.seats = t.seats.filter(s => s !== id));
    save(); render();
  }
  else if (a === "auto-arrange") { autoArrange(); render(); }
  else if (a === "add-table") {
    state.tables.push({ id: uid(), name: `Table ${state.tables.length + 1}`, capacity: 8, seats: [] });
    save(); render();
  }
  else if (a === "clear-seats") { state.tables.forEach(t => t.seats = []); save(); render(); }
  else if (a === "table-remove") {
    state.tables = state.tables.filter(t => t.id !== el.dataset.id); save(); render();
  }
  else if (a === "unseat") {
    state.tables.forEach(t => t.seats = t.seats.filter(s => s !== el.dataset.id)); save(); render();
  }
  else if (a === "conflict-add") {
    const A = document.getElementById("cfA").value, B = document.getElementById("cfB").value;
    if (A && B && A !== B && !state.conflicts.some(([x, y]) => (x === A && y === B) || (x === B && y === A))) {
      state.conflicts.push([A, B]);
      // If they're currently at the same table, unseat the second.
      state.tables.forEach(t => { if (t.seats.includes(A) && t.seats.includes(B)) t.seats = t.seats.filter(s => s !== B); });
      save(); render();
    }
  }
  else if (a === "conflict-remove") {
    state.conflicts.splice(Number(el.dataset.i), 1); save(); render();
  }
  else if (a === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const aEl = document.createElement("a");
    aEl.href = URL.createObjectURL(blob);
    aEl.download = "ever-after-backup.json";
    aEl.click(); URL.revokeObjectURL(aEl.href);
  }
  else if (a === "import") {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      f.text().then(txt => {
        try {
          const data = JSON.parse(txt);
          if (!data.setup) throw new Error("not a backup");
          state = Object.assign(blankState(), data); save(); render();
        } catch { alert("That file doesn't look like an Ever After backup."); }
      });
    };
    inp.click();
  }
  else if (a === "reset") {
    if (confirm("Start completely over? This erases everything saved in this browser.")) {
      state = blankState(); save(); render();
    }
  }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "task") { state.tasksDone[el.dataset.id] = el.checked; save(); render(); }
  else if (a === "vendor-q") { state.vendorChecks[el.dataset.id] = el.checked; save(); render(); }
  else if (a === "vendor-status") {
    const v = state.vendors[el.dataset.id] || { status: "researching", notes: "" };
    v.status = el.value; state.vendors[el.dataset.id] = v; save(); render();
  }
  else if (a === "vendor-notes") {
    const v = state.vendors[el.dataset.id] || { status: "researching", notes: "" };
    v.notes = el.value; state.vendors[el.dataset.id] = v; save();
  }
  else if (a === "budget-spent") {
    state.budgetSpent[el.dataset.id] = Number(el.value) || 0; save(); render();
  }
  else if (a === "pay-toggle") { state.paymentsPaid[el.dataset.id] = el.checked; save(); render(); }
  else if (a === "guest-status") {
    const g = guestById(el.dataset.id);
    if (g) {
      g.status = el.value;
      if (g.status === "declined") state.tables.forEach(t => t.seats = t.seats.filter(s => s !== g.id));
      save(); render();
    }
  }
  else if (a === "assign") {
    const t = state.tables.find(x => x.id === el.value);
    const g = guestById(el.dataset.id);
    if (t && g && tableFree(t) >= g.party && !hasConflict(g.id, t.seats)) {
      t.seats.push(g.id); save(); render();
    } else if (t && g && hasConflict(g.id, t.seats)) {
      alert(`${g.name} has a “seat apart” rule with someone at ${t.name}.`); render();
    }
  }
  else if (a === "table-cap") {
    const t = state.tables.find(x => x.id === el.dataset.id);
    if (t) { t.capacity = Math.max(1, Number(el.value) || 8); save(); render(); }
  }
});

// contenteditable table names save on blur
document.addEventListener("blur", e => {
  const el = e.target.closest ? e.target.closest("[data-action-blur='table-name']") : null;
  if (!el) return;
  const t = state.tables.find(x => x.id === el.dataset.id);
  if (t) { t.name = el.textContent.trim() || t.name; el.textContent = t.name; save(); }
}, true);

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "setupForm") {
    const get = id => document.getElementById(id).value.trim();
    state.setup = {
      names: get("f-names"),
      date: get("f-date"),
      venueType: get("f-venue"),
      budget: Number(get("f-budget")),
      guestCount: Number(get("f-guests")),
      keywords: [get("f-kw1"), get("f-kw2"), get("f-kw3")].map(k => k.toLowerCase())
    };
    state.view = "overview"; save(); render();
    window.scrollTo(0, 0);
  }
  else if (e.target.id === "payForm") {
    state.customPayments.push({
      id: uid(),
      title: document.getElementById("pf-title").value.trim(),
      due: document.getElementById("pf-date").value,
      amount: Number(document.getElementById("pf-amt").value) || 0
    });
    save(); render();
  }
  else if (e.target.id === "guestForm") {
    state.guests.push({
      id: uid(),
      name: document.getElementById("gf-name").value.trim(),
      party: Math.max(1, Number(document.getElementById("gf-party").value) || 1),
      group: document.getElementById("gf-group").value.trim(),
      status: document.getElementById("gf-status").value
    });
    save(); render();
  }
});

/* budget hover tooltip */
document.addEventListener("mousemove", e => {
  const row = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (row && !e.target.closest("input")) {
    $tip.textContent = row.dataset.tip;
    $tip.style.display = "block";
    const x = Math.min(e.pageX + 14, document.documentElement.scrollWidth - 260);
    $tip.style.left = x + "px";
    $tip.style.top = (e.pageY + 16) + "px";
  } else {
    $tip.style.display = "none";
  }
});

render();
</script>
</body>
</html>
